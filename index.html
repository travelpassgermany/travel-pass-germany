<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Pass Germany</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .hero {
      background: white;
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .hero h2 {
      font-size: 38px;
      margin-top: 0;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
    }

    .chat-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 62px;
      height: 62px;
      border: none;
      border-radius: 50%;
      background: #25D366;
      color: white;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      z-index: 9999;
    }

    .chat-box {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 95px;
      width: 340px;
      max-width: calc(100vw - 40px);
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      overflow: hidden;
      z-index: 9999;
    }

    .chat-header {
      background: #25D366;
      color: white;
      padding: 16px;
      font-weight: bold;
    }

    .chat-body {
      padding: 16px;
    }

    .chat-body p {
      margin-top: 0;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #25D366;
    }

    .send-button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-button:hover {
      opacity: 0.9;
    }

    .close-button {
      float: right;
      border: none;
      background: transparent;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 28px;
      }

      .chat-box {
        right: 10px;
        bottom: 85px;
        width: calc(100vw - 20px);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Travel Pass Germany</h1>
  </header>

  <main>
    <section class="hero">
      <h2>Almanya Seyahatiniz İçin Yardım</h2>

      <p>
        Almanya seyahati, vize, ulaşım ve diğer konularda
        bize WhatsApp üzerinden ulaşabilirsiniz.
      </p>

      <p>
        Sağ alttaki WhatsApp simgesine tıklayarak mesaj gönderebilirsiniz.
      </p>
    </section>
  </main>

  <!-- CHAT BUTONU -->
  <button
    class="chat-button"
    onclick="toggleChat()"
    aria-label="WhatsApp ile iletişim">
    💬
  </button>

  <!-- CHAT KUTUSU -->
  <div class="chat-box" id="chatBox">

    <div class="chat-header">
      Travel Pass Germany

      <button
        class="close-button"
        onclick="toggleChat()">
        ×
      </button>
    </div>

    <div class="chat-body">

      <p>
        Merhaba! Size nasıl yardımcı olabiliriz?
      </p>

      <textarea
        id="whatsappMessage"
        placeholder="Mesajınızı buraya yazın..."></textarea>

      <button
        class="send-button"
        onclick="sendWhatsApp()">
        WhatsApp'tan Gönder
      </button>

    </div>
  </div>

  <script>
    function toggleChat() {
      const chatBox = document.getElementById("chatBox");

      if (chatBox.style.display === "block") {
        chatBox.style.display = "none";
      } else {
        chatBox.style.display = "block";
        document.getElementById("whatsappMessage").focus();
      }
    }

    function sendWhatsApp() {
      const message =
        document.getElementById("whatsappMessage").value.trim();

      if (!message) {
        alert("Lütfen mesajınızı yazın.");
        return;
      }

      const phoneNumber = "905016395369";

      const whatsappUrl =
        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        encodeURIComponent(message);

      window.open(whatsappUrl, "_blank");
    }
  </script>

</body>
</html>
